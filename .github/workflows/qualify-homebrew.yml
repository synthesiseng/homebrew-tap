name: Qualify Gitrole Homebrew 0.13.4

on:
  push:
    branches: [qualification/homebrew-0.13.4]

permissions:
  contents: read

concurrency:
  group: homebrew-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'synthesiseng/homebrew-tap' && github.ref == 'refs/heads/qualification/homebrew-0.13.4'
    name: Homebrew (${{ matrix.scenario }}, macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    steps:
      - name: Check out qualification harness
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Qualify installed package
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: python3 -B .github/scripts/qualify-homebrew.py "$SCENARIO"
